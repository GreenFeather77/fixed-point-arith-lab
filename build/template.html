<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>定点演算纸</title>
    <meta name="theme-color" content="#efe6d6" />
    <meta
      name="description"
      content="二进制小数的原码 / 补码乘除法演算，逐步展示寄存器与规则。"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'%3E%3Crect width='32' height='32' rx='8' fill='%23204740'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='ui-monospace,monospace' font-size='11' font-weight='600' fill='%23F4EFE4'%3E0.1%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
    />
    <style>
      /*__STYLES__*/
    </style>
  </head>
  <body>
    <div class="page">
      <header class="page-head">
        <div class="head-text">
          <p class="eyebrow">定点小数 · 机器数演算</p>
          <h1>原码 / 补码 乘除法</h1>
          <p class="lede">
            按计算机组成原理规则，对二进制小数做原码一位/两位乘法、Booth 补码乘法，以及原码恢复余数、加减交替与补码除法。点按位翻转即可改操作数。
          </p>
        </div>
        <div class="head-tools">
          <div class="stepper">
            <span class="stepper-label">尾数</span>
            <button type="button" id="n-dec" aria-label="减少尾数位数"></button>
            <span class="stepper-value mono" id="n-value">4</span>
            <button type="button" id="n-inc" aria-label="增加尾数位数"></button>
            <span class="stepper-unit">位</span>
          </div>
          <button type="button" class="icon-btn" id="reset" aria-label="重置"></button>
        </div>
      </header>

      <div class="op-tabs" id="op-tabs"></div>

      <section class="grid">
        <div class="panel">
          <div class="encoding-tabs" id="encoding-tabs"></div>
          <p class="hint" id="encoding-hint"></p>

          <div class="operand" id="operand-x">
            <div class="operand-head">
              <label class="field-label" id="label-x">被乘数 X</label>
              <button type="button" class="mini-btn" data-negate="x">取负</button>
            </div>
            <input
              class="bit-input"
              id="input-x"
              spellcheck="false"
              autocapitalize="off"
              autocomplete="off"
              placeholder="0.1011"
            />
            <div class="pad-head">
              <p class="pad-hint">点按位翻转 · 左起为符号位</p>
              <div class="legend">
                <span><span class="swatch"></span>1</span>
                <span><span class="swatch swatch-zero"></span>0</span>
              </div>
            </div>
            <div id="pad-x"></div>
            <div class="forms-box" id="forms-x"></div>
          </div>

          <div class="swap-row" id="swap-row" style="display: flex; justify-content: center">
            <button type="button" class="mini-btn" id="swap"></button>
          </div>

          <div class="operand" id="operand-y">
            <div class="operand-head">
              <label class="field-label" id="label-y">乘数 Y</label>
              <button type="button" class="mini-btn" data-negate="y">取负</button>
            </div>
            <input
              class="bit-input"
              id="input-y"
              spellcheck="false"
              autocapitalize="off"
              autocomplete="off"
              placeholder="0.1011"
            />
            <div class="pad-head">
              <p class="pad-hint">点按位翻转 · 左起为符号位</p>
              <div class="legend">
                <span><span class="swatch"></span>1</span>
                <span><span class="swatch swatch-zero"></span>0</span>
              </div>
            </div>
            <div id="pad-y"></div>
            <div class="forms-box" id="forms-y"></div>
          </div>

          <div class="algo-grid" id="algo-grid"></div>

          <div>
            <p class="preset-label-title">教材例题</p>
            <div class="presets" id="presets"></div>
          </div>
        </div>

        <div class="right-col" id="right-col"></div>
      </section>

      <div id="steps-host"></div>

      <footer class="foot">
        <p>
          乘法结果保留 2n 位尾数；除法商保留 n 位。补码除法按教材「末位恒置 1」校正，与真值的误差不超过
          2⁻ⁿ。部分积 / 余数在演算中使用双符号位，避免加减溢出被误判。
        </p>
      </footer>
    </div>

    <script>
      /*__LOGIC__*/
    </script>
    <script>
      /*__APP__*/
    </script>
  </body>
</html>
